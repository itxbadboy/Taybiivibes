<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taybii Archives</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Light Theme (Default) */
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #8e8e93;
            --accent: #007aff;
            --glass-border: rgba(0, 0, 0, 0.05);
            --input-bg: #e5e5ea;
            --btn-bg: #e5e5ea;
        }

        /* Dark Theme (Toggled) */
        :root.dark-theme {
            --bg-color: #000000;
            --card-bg: #151515;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #0a84ff;
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: #1c1c1e;
            --btn-bg: #2c2c2e;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; padding-top: 40px; transition: background-color 0.3s, color 0.3s; }
        
        /* Header UI */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--card-bg); padding: 12px 20px; border-radius: 30px; transition: background-color 0.3s; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: var(--text-main); color: var(--bg-color); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; transition: 0.3s; }
        .brand-text h1 { margin: 0; font-size: 16px; font-weight: 600; }
        .brand-text p { margin: 0; font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .theme-toggle { font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 5px; }
        
        h2.title { font-size: 32px; font-weight: 700; margin: 0 0 8px 0; }
        p.subtitle { color: var(--text-muted); font-size: 15px; margin: 0 0 24px 0; }
        
        /* Search */
        .search-container { position: relative; margin-bottom: 24px; }
        .search-container i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-bar { width: 100%; background: var(--input-bg); border: none; border-radius: 16px; padding: 16px 16px 16px 44px; color: var(--text-main); font-size: 16px; outline: none; transition: 0.3s; }
        
        /* Category Pills */
        .categories { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 24px; padding-bottom: 5px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--input-bg); color: var(--text-muted); border: none; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: var(--text-main); color: var(--bg-color); }
        
        /* Dynamic Post Cards */
        .post-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 16px; transition: background-color 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .card-icon { background: var(--btn-bg); width: 44px; height: 44px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 20px; transition: 0.3s; }
        .card-meta { text-align: right; font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .card-title { font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: var(--text-main); }
        .card-desc { color: var(--text-muted); font-size: 14px; line-height: 1.4; margin: 0 0 20px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-actions { display: flex; gap: 10px; }
        .btn-read { flex: 1; background: var(--btn-bg); color: var(--text-main); border: none; border-radius: 14px; padding: 14px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; }
        .btn-dl { background: var(--accent); color: #fff; border: none; border-radius: 14px; width: 48px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }

        /* Hidden Admin Overlay */
        .admin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 99999; display: none; justify-content: center; align-items: center; padding: 20px; color: #fff; }
        .admin-box { background: rgba(25, 25, 25, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .admin-input, .admin-select { width: 100%; background: #000; border: 1px solid #333; border-radius: 14px; padding: 14px; color: white; margin-bottom: 12px; font-size: 15px; outline: none; }
        .admin-btn { background: #0a84ff; color: white; border: none; border-radius: 14px; padding: 16px; width: 100%; font-weight: 600; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .admin-btn-danger { background: #ff453a; }
        .admin-btn-outline { background: transparent; border: 1px solid #333; }
        .admin-post-item { background: #000; padding: 16px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div class="brand">
            <div class="logo-icon"><i class="fa-solid fa-bookmark"></i></div>
            <div class="brand-text">
                <h1>Taybii Archives</h1>
                <p>Premium Access</p>
            </div>
        </div>
        <i class="fa-solid fa-circle-half-stroke theme-toggle" onclick="toggleTheme()"></i>
    </div>

    <h2 class="title">Library</h2>
    <p class="subtitle">Discover Islamic history, software, and scripts.</p>

    <!-- Search Bar -->
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="mainSearch" class="search-bar" placeholder="Q Search">
    </div>

    <!-- Category Filter Tabs -->
    <div class="categories" id="categoryTabs"></div>

    <!-- Feed Container -->
    <div id="postContainer"></div>

    <!-- 1. HIDDEN LOGIN PANEL -->
    <div id="adminLoginPanel" class="admin-overlay">
        <div class="admin-box">
            <h2 style="margin-top:0;">Admin Access</h2>
            <input type="text" id="adminUser" class="admin-input" placeholder="Username">
            <input type="password" id="adminPass" class="admin-input" placeholder="Password">
            <button onclick="verifyLogin()" class="admin-btn">Login</button>
            <button onclick="closeAdmin()" class="admin-btn admin-btn-outline">Cancel</button>
        </div>
    </div>

    <!-- 2. HIDDEN ADMIN DASHBOARD -->
    <div id="adminDashboard" class="admin-overlay">
        <div class="admin-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2 style="margin:0;">Dashboard</h2>
                <button onclick="closeAdmin()" style="background:none; border:none; color:white; font-size:24px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- GitHub Token Configuration -->
            <div style="margin-bottom: 20px; background: #000; padding: 12px; border-radius: 12px; border: 1px solid #333;">
                <label style="font-size:12px; color:#8e8e93; display:block; margin-bottom:6px;">GitHub Personal Access Token</label>
                <input type="password" id="githubToken" class="admin-input" placeholder="ghp_xxxxxxxxxxxx" style="margin:0;" onchange="saveToken(this.value)">
            </div>

            <!-- Category Creator -->
            <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #333;">
                <h3 style="margin-top:0; font-size:16px; color:#8e8e93;">Add New Category</h3>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="newCategory" class="admin-input" placeholder="Category Name" style="margin:0;">
                    <button onclick="addCategory()" class="admin-btn" style="width: auto; padding: 0 20px; margin:0;">Add</button>
                </div>
            </div>

            <!-- Post Editor -->
            <h3 style="margin-top:0; font-size:16px; color:#8e8e93;">Create / Edit Post</h3>
            <input type="hidden" id="editPostId">
            <input type="text" id="postTitle" class="admin-input" placeholder="Post Title">
            <select id="postCat" class="admin-select"></select>
            <input type="text" id="postFormat" class="admin-input" placeholder="Format Label (e.g., TXT, APK, PDF)">
            <input type="url" id="postDownloadLink" class="admin-input" placeholder="Download Link (Drive URL, etc.)">
            <textarea id="postDesc" class="admin-input" rows="2" placeholder="Short description..."></textarea>
            <textarea id="postContent" class="admin-input" rows="4" placeholder="Full Text Content or Script Details..."></textarea>
            <button onclick="savePostToGitHub()" class="admin-btn" id="saveBtn">Publish to GitHub</button>

            <!-- Post Manager List -->
            <h3 style="margin-top:24px; font-size:16px; color:#8e8e93;">Manage Existing Posts</h3>
            <div id="adminPostList"></div>
        </div>
    </div>

    <!-- SYSTEM LOGIC -->
    <script>
        if(localStorage.getItem('taybii_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark-theme');
            localStorage.setItem('taybii_theme', document.documentElement.classList.contains('dark-theme') ? 'dark' : 'light');
        }

        // DATABASE ARRAY (Directly embedded in code for auto-sync)
        let categories = ["Software", "Books", "Islamic Books", "Text Script", "All Social Media"];
        let posts = [
            {
                id: 1,
                title: "Woh Aankhon Ki Khayanat",
                category: "Text Script",
                format: "TXT",
                date: "Sep 13, 2026",
                desc: "Short script focusing on divine knowledge and absolute truth.",
                fullText: "Woh aankhon ki khayanat ko jaanta hai. Aur jo baatein seenon mein posheeda hain, un ko bhi.",
                downloadLink: ""
            }
        ];
        let currentFilter = "All";

        function generatePostHTML(post) {
            const dlAction = post.downloadLink 
                ? `window.open('${post.downloadLink}', '_blank')` 
                : `alert('No download link available for this file.')`;
            
            return `
                <div class="post-card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fa-solid fa-file-lines"></i></div>
                        <div class="card-meta">
                            <div>${post.format || 'TXT'}</div>
                            <div style="font-weight:400; margin-top:4px;">${post.date}</div>
                        </div>
                    </div>
                    <h3 class="card-title">${post.title}</h3>
                    <p class="card-desc">${post.desc}</p>
                    <div class="card-actions">
                        <button class="btn-read" onclick="alert('Viewing Details:\\n\\n${post.fullText}')">Read</button>
                        <button class="btn-dl" onclick="${dlAction}"><i class="fa-solid fa-arrow-down"></i></button>
                    </div>
                </div>
            `;
        }

        function renderUI() {
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = `<button class="cat-btn ${currentFilter === 'All' ? 'active' : ''}" onclick="filterPosts('All')">All</button>`;
            categories.forEach(cat => {
                tabs.innerHTML += `<button class="cat-btn ${currentFilter === cat ? 'active' : ''}" onclick="filterPosts('${cat}')">${cat}</button>`;
            });

            const catSelect = document.getElementById('postCat');
            catSelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');

            const container = document.getElementById('postContainer');
            const filteredPosts = currentFilter === "All" ? posts : posts.filter(p => p.category === currentFilter);
            container.innerHTML = filteredPosts.map(generatePostHTML).join('');

            const adminList = document.getElementById('adminPostList');
            adminList.innerHTML = posts.map(post => `
                <div class="admin-post-item">
                    <div style="width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        <div style="font-weight:600; font-size:15px;">${post.title}</div>
                        <div style="font-size:12px; color:#8e8e93;">${post.category}</div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button onclick="editPost(${post.id})" class="admin-btn" style="padding: 8px 12px; margin:0; width:auto; border-radius:8px;"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deletePost(${post.id})" class="admin-btn admin-btn-danger" style="padding: 8px 12px; margin:0; width:auto; border-radius:8px;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function filterPosts(cat) {
            currentFilter = cat;
            renderUI();
        }

        const searchInput = document.getElementById('mainSearch');
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if(val === "CallmeTaybiii786#") {
                document.getElementById('adminLoginPanel').style.display = 'flex';
                e.target.value = ""; 
                return;
            }
            const lowerVal = val.toLowerCase();
            const container = document.getElementById('postContainer');
            const searchResults = posts.filter(p => p.title.toLowerCase().includes(lowerVal) || p.desc.toLowerCase().includes(lowerVal));
            if(val.trim() === '') { renderUI(); } 
            else { container.innerHTML = searchResults.map(generatePostHTML).join(''); }
        });

        function verifyLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if(user === "Badboy" && pass === "Badboy101#") {
                document.getElementById('adminLoginPanel').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'flex';
                document.getElementById('adminUser').value = "";
                document.getElementById('adminPass').value = "";
                document.getElementById('githubToken').value = localStorage.getItem('taybii_gh_token') || "";
            } else {
                alert("Invalid Admin Credentials.");
            }
        }

        function closeAdmin() {
            document.getElementById('adminLoginPanel').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'none';
        }

        function saveToken(token) {
            localStorage.setItem('taybii_gh_token', token.trim());
        }

        function addCategory() {
            const newCat = document.getElementById('newCategory').value.trim();
            if(newCat && !categories.includes(newCat)) {
                categories.push(newCat);
                document.getElementById('newCategory').value = "";
                renderUI();
                commitChangesToGitHub("Added category: " + newCat);
            }
        }

        function savePostToGitHub() {
            const id = document.getElementById('editPostId').value || Date.now();
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCat').value;
            const format = document.getElementById('postFormat').value || "TXT";
            const downloadLink = document.getElementById('postDownloadLink').value;
            const desc = document.getElementById('postDesc').value;
            const content = document.getElementById('postContent').value;
            
            if(!title || !category) return alert("Title and Category are required!");

            const postData = { 
                id: Number(id), 
                title, 
                category, 
                format,
                downloadLink,
                desc,
                fullText: content, 
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) 
            };
            
            const existingIndex = posts.findIndex(p => p.id === Number(id));
            if(existingIndex >= 0) {
                posts[existingIndex] = postData;
            } else {
                posts.unshift(postData);
            }

            document.getElementById('editPostId').value = "";
            document.getElementById('postTitle').value = "";
            document.getElementById('postFormat').value = "";
            document.getElementById('postDownloadLink').value = "";
            document.getElementById('postDesc').value = "";
            document.getElementById('postContent').value = "";
            renderUI();
            
            commitChangesToGitHub("Updated post: " + title);
        }

        function editPost(id) {
            const post = posts.find(p => p.id === id);
            if(post) {
                document.getElementById('editPostId').value = post.id;
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postCat').value = post.category;
                document.getElementById('postFormat').value = post.format || "";
                document.getElementById('postDownloadLink').value = post.downloadLink || "";
                document.getElementById('postDesc').value = post.desc;
                document.getElementById('postContent').value = post.fullText;
                document.querySelector('.admin-box').scrollTo(0, 0);
            }
        }

        function deletePost(id) {
            if(confirm("Are you sure you want to delete this post?")) {
                posts = posts.filter(p => p.id !== id);
                renderUI();
                commitChangesToGitHub("Deleted a post");
            }
        }

        // AUTOMATIC GITHUB FILE COMMUNICATOR
        async function commitChangesToGitHub(message) {
            const token = localStorage.getItem('taybii_gh_token');
            if(!token) {
                alert("Changes saved locally, but no GitHub Token was found! Please enter your GitHub Token in the dashboard field so it can auto-sync to your live site.");
                return;
            }

            const repo = "itxbadboy/Taybiivibes";
            const path = "index.html";
            const btn = document.getElementById('saveBtn');
            if(btn) btn.innerText = "Syncing to GitHub...";

            try {
                // 1. Get current file sha from GitHub
                const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if(!getRes.ok) throw new Error("Failed to fetch repo file. Check your token permissions.");
                const fileData = await getRes.json();

                // 2. Generate new updated HTML string dynamically with current posts/categories arrays
                const currentHTML = document.documentElement.outerHTML;
                const updatedCode = "<!DOCTYPE html>\n" + currentHTML;

                // 3. Push update back to GitHub
                const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message,
                        content: btoa(unescape(encodeURIComponent(updatedCode))),
                        sha: fileData.sha
                    })
                });

                if(putRes.ok) {
                    alert("Successfully synced! Your live website will update in about 30 seconds.");
                } else {
                    const errJson = await putRes.json();
                    alert("GitHub Sync Error: " + errJson.message);
                }
            } catch(err) {
                alert("Error connecting to GitHub: " + err.message);
            } finally {
                if(btn) btn.innerText = "Publish to GitHub";
            }
        }

        renderUI();
    </script>
</body>
</html>
